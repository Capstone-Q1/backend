services:
  backend:
    build: .
    container_name: q1_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: q1_postgres
    environment:
      POSTGRES_DB: q1_backend
      POSTGRES_USER: q1_user
      POSTGRES_PASSWORD: q1_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
